<title>Courtside Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;900&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
  :root{
    --ground:#0a0c0b;
    --panel:#131715;
    --panel-edge:#242b28;
    --ink:#e8ece9;
    --muted:#7d8a84;
    --home:#ffb020;
    --away:#4fc3f7;
    --home-dim:#3a2c10;
    --away-dim:#12303d;
    --danger:#ff7a5f;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button{font-family:inherit;}

  #app{height:100%;display:flex;flex-direction:column;padding:0 12px;box-sizing:border-box;}

  /* ---- series strip ---- */
  .strip{
    display:flex;align-items:baseline;gap:10px;
    padding-top:calc(8px + env(safe-area-inset-top,0px));
    padding-bottom:6px;
  }
  .game-no{
    font:600 12px/1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .series{
    margin-left:auto;
    font:600 12px/1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .series b{color:var(--home);font-weight:700;}
  .series i{color:var(--away);font-style:normal;font-weight:700;}

  /* ---- courts ---- */
  .courts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px;}
  .side{
    display:flex;flex-direction:column;gap:8px;min-width:0;
    background:var(--panel);border:1px solid var(--panel-edge);
    border-radius:14px;padding:10px;box-sizing:border-box;
  }
  .side.home{border-top:4px solid var(--home);}
  .side.away{border-top:4px solid var(--away);}

  .name{
    width:100%;box-sizing:border-box;background:transparent;border:0;
    border-bottom:1px dashed transparent;color:var(--muted);
    font:600 15px/1.1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;text-align:center;
    padding:4px 0;min-width:0;
  }
  .name:focus{outline:none;border-bottom-color:var(--panel-edge);color:var(--ink);}

  .score{
    font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:900;
    font-variant-numeric:tabular-nums;font-size:clamp(58px,20vw,180px);
    line-height:.86;text-align:center;letter-spacing:-.02em;padding:2px 0 6px;
  }
  .home .score{color:var(--home);}
  .away .score{color:var(--away);}

  .keys{flex:1;min-height:0;display:grid;grid-template-rows:1.35fr 1fr 1fr;gap:8px;}
  .add{
    border:1px solid var(--panel-edge);border-radius:12px;background:#1b211e;color:var(--ink);
    font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:700;
    font-size:clamp(22px,6.5vw,42px);line-height:1;cursor:pointer;
    transition:transform .07s ease;min-height:48px;
  }
  .home .add{background:var(--home-dim);border-color:#4a3714;color:#ffd48a;}
  .away .add{background:var(--away-dim);border-color:#163f50;color:#a9e2fb;}
  .home .add.big{background:var(--home);color:#1a1205;border-color:var(--home);}
  .away .add.big{background:var(--away);color:#04212c;border-color:var(--away);}
  .add:active{transform:scale(.96);}
  .add:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  /* ---- bottom bar ---- */
  .bar{display:flex;gap:8px;align-items:stretch;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));}
  .bar button{
    flex:1;background:transparent;border:1px solid var(--panel-edge);border-radius:11px;
    color:var(--muted);font:600 13px/1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;padding:14px 6px;cursor:pointer;
    white-space:nowrap;
  }
  .bar button:active:not(:disabled){background:var(--panel);color:var(--ink);}
  .bar button:disabled{opacity:.28;cursor:default;}
  .bar button:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .bar button.armed{border-color:#c2422d;color:var(--danger);}

  /* ---- games sheet ---- */
  .sheet{
    position:fixed;inset:0;background:rgba(6,8,7,.86);
    display:flex;align-items:flex-end;justify-content:center;z-index:10;
  }
  .sheet-inner{
    width:100%;max-width:520px;max-height:78%;
    background:var(--panel);border:1px solid var(--panel-edge);
    border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
    box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  }
  .sheet h2{
    margin:0;font:600 13px/1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
  .tally{display:flex;gap:8px;}
  .tally div{flex:1;border:1px solid var(--panel-edge);border-radius:10px;padding:10px;text-align:center;min-width:0;}
  .tally b{
    display:block;font-family:"Saira Condensed",sans-serif;font-weight:900;
    font-size:30px;line-height:1;font-variant-numeric:tabular-nums;
  }
  .tally.home b{color:var(--home);}
  .tally.away b{color:var(--away);}
  .tally span{
    display:block;font:600 10px/1.4 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .log{overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
  .log-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;
    padding:9px 2px;border-bottom:1px solid #1c211f;
    font:500 14px/1.2 "IBM Plex Sans Condensed",sans-serif;
  }
  .log-row .no{color:var(--muted);font-size:11px;letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  .log-row .who{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .log-row .fin{
    font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:17px;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .empty{color:var(--muted);font-size:14px;line-height:1.5;padding:18px 2px;margin:0;}
  .sheet-actions{display:flex;gap:8px;}
  .sheet-actions button{
    flex:1;border:1px solid var(--panel-edge);background:transparent;border-radius:11px;
    color:var(--ink);font:600 13px/1 "IBM Plex Sans Condensed",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;padding:14px;cursor:pointer;
  }
  .sheet-actions button:active{background:#1b211e;}
  .sheet-actions button.armed{border-color:#c2422d;color:var(--danger);}
  .sheet-actions button:disabled{opacity:.28;cursor:default;}

  @media (prefers-reduced-motion:reduce){.add{transition:none;}}
</style>

<div id="app">
  <div class="strip">
    <span id="game-no" class="game-no">Game 1</span>
    <span id="series" class="series"></span>
  </div>

  <div class="courts">
    <section class="side home">
      <input id="name-a" class="name" value="HOME" aria-label="Home team name" spellcheck="false" maxlength="10">
      <div id="score-a" class="score" aria-live="polite">0</div>
      <div class="keys">
        <button class="add big" data-team="a" data-pts="2">+2</button>
        <button class="add" data-team="a" data-pts="3">+3</button>
        <button class="add" data-team="a" data-pts="1">+1</button>
      </div>
    </section>
    <section class="side away">
      <input id="name-b" class="name" value="AWAY" aria-label="Away team name" spellcheck="false" maxlength="10">
      <div id="score-b" class="score" aria-live="polite">0</div>
      <div class="keys">
        <button class="add big" data-team="b" data-pts="2">+2</button>
        <button class="add" data-team="b" data-pts="3">+3</button>
        <button class="add" data-team="b" data-pts="1">+1</button>
      </div>
    </section>
  </div>

  <div class="bar">
    <button id="undo" disabled>Undo</button>
    <button id="endgame">End game</button>
    <button id="games">Games</button>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner">
    <h2>Games played</h2>
    <div class="tally">
      <div class="home"><b id="wins-a">0</b><span id="wins-a-label">Home</span></div>
      <div><b id="games-count">0</b><span>Played</span></div>
      <div class="away"><b id="wins-b">0</b><span id="wins-b-label">Away</span></div>
    </div>
    <div id="log" class="log"></div>
    <div class="sheet-actions">
      <button id="clear-history">Clear history</button>
      <button id="sheet-close">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "courtside-v2-state";

  var game = { a:0, b:0, nameA:"HOME", nameB:"AWAY", log:[], gameNo:1 };
  var results = [];   // [{a, b, nameA, nameB, at}]

  var el = {};
  ["score-a","score-b","name-a","name-b","undo","endgame","games","game-no","series",
   "sheet","sheet-close","clear-history","log","wins-a","wins-b","games-count",
   "wins-a-label","wins-b-label"
  ].forEach(function(id){ el[id] = document.getElementById(id); });
  var addBtns = Array.prototype.slice.call(document.querySelectorAll(".add"));

  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var s = JSON.parse(raw);
      if(s && s.game && typeof s.game.a === "number" && typeof s.game.b === "number"){
        game = s.game;
        if(!Array.isArray(game.log)) game.log = [];
        if(typeof game.gameNo !== "number") game.gameNo = 1;
        if(typeof game.nameA !== "string") game.nameA = "HOME";
        if(typeof game.nameB !== "string") game.nameB = "AWAY";
      }
      var r = s && (s.results || (s.history && s.history.results));
      if(Array.isArray(r)) results = r;
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({game:game, results:results})); }catch(e){}
  }

  function wins(){
    var a = 0, b = 0;
    results.forEach(function(r){ if(r.a > r.b) a++; else if(r.b > r.a) b++; });
    return {a:a, b:b};
  }

  function render(){
    el["score-a"].textContent = game.a;
    el["score-b"].textContent = game.b;
    if(document.activeElement !== el["name-a"]) el["name-a"].value = game.nameA;
    if(document.activeElement !== el["name-b"]) el["name-b"].value = game.nameB;

    el.undo.disabled = game.log.length === 0;
    el["game-no"].textContent = "Game " + game.gameNo;

    if(results.length){
      var w = wins();
      el.series.innerHTML = "";
      var b = document.createElement("b"); b.textContent = w.a;
      var i = document.createElement("i"); i.textContent = w.b;
      el.series.appendChild(b);
      el.series.appendChild(document.createTextNode(" – "));
      el.series.appendChild(i);
    }else{
      el.series.textContent = "";
    }

    if(!el.sheet.hidden) renderSheet();
  }

  function renderSheet(){
    var w = wins();
    el["wins-a"].textContent = w.a;
    el["wins-b"].textContent = w.b;
    el["games-count"].textContent = results.length;
    el["wins-a-label"].textContent = game.nameA || "Home";
    el["wins-b-label"].textContent = game.nameB || "Away";
    el["clear-history"].disabled = results.length === 0;

    el.log.textContent = "";
    if(!results.length){
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No finished games yet. Tap “End game” when one wraps up and the final lands here.";
      el.log.appendChild(p);
      return;
    }
    for(var k = results.length - 1; k >= 0; k--){
      var r = results[k];
      var row = document.createElement("div");
      row.className = "log-row";
      var no = document.createElement("span");
      no.className = "no"; no.textContent = k + 1;
      var who = document.createElement("span");
      who.className = "who";
      who.textContent = (r.nameA || "Home") + " v " + (r.nameB || "Away");
      var fin = document.createElement("span");
      fin.className = "fin"; fin.textContent = r.a + " – " + r.b;
      row.appendChild(no); row.appendChild(who); row.appendChild(fin);
      el.log.appendChild(row);
    }
  }

  function commit(){ render(); save(); }

  // ---- scoring ----
  addBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      var team = btn.dataset.team, pts = parseInt(btn.dataset.pts, 10);
      game[team] += pts;
      game.log.push([team, pts]);
      if(game.log.length > 300) game.log.shift();
      disarm();
      buzz(12);
      commit();
    });
  });

  el.undo.addEventListener("click", function(){
    var last = game.log.pop();
    if(!last) return;
    game[last[0]] -= last[1];
    disarm();
    buzz(12);
    commit();
  });

  // ---- two-tap confirm ----
  var armedBtn = null, armTimer = null;
  function disarm(){
    if(armedBtn){
      armedBtn.classList.remove("armed");
      armedBtn.textContent = armedBtn.dataset.label;
    }
    armedBtn = null;
    clearTimeout(armTimer);
  }
  function arm(btn, label){
    disarm();
    btn.classList.add("armed");
    btn.textContent = label;
    armedBtn = btn;
    armTimer = setTimeout(disarm, 3000);
  }

  el.endgame.dataset.label = "End game";
  el.endgame.addEventListener("click", function(){
    if(armedBtn !== el.endgame){ arm(el.endgame, "Save final?"); return; }
    disarm();
    results.push({ a:game.a, b:game.b, nameA:game.nameA, nameB:game.nameB, at:Date.now() });
    if(results.length > 100) results.shift();
    game.gameNo += 1;
    game.a = 0; game.b = 0; game.log = [];
    buzz([14,70,14]);
    commit();
  });

  el["clear-history"].dataset.label = "Clear history";
  el["clear-history"].addEventListener("click", function(){
    if(armedBtn !== el["clear-history"]){ arm(el["clear-history"], "Wipe all?"); return; }
    disarm();
    results = [];
    game.gameNo = 1;
    commit();
  });

  // ---- sheet ----
  el.games.addEventListener("click", function(){ disarm(); el.sheet.hidden = false; renderSheet(); });
  el["sheet-close"].addEventListener("click", function(){ disarm(); el.sheet.hidden = true; });
  el.sheet.addEventListener("click", function(e){ if(e.target === el.sheet){ disarm(); el.sheet.hidden = true; } });

  // ---- team names ----
  function onName(input, field){
    input.addEventListener("input", function(){ game[field] = input.value; save(); render(); });
    input.addEventListener("focus", function(){ input.select(); });
  }
  onName(el["name-a"], "nameA");
  onName(el["name-b"], "nameB");

  // ---- keyboard, for a laptop on the bench ----
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ disarm(); el.sheet.hidden = true; return; }
    if(e.target.tagName === "INPUT") return;
    var map = {"1":["a",1],"2":["a",2],"3":["a",3],"8":["b",1],"9":["b",2],"0":["b",3]};
    if(map[e.key]){
      var m = map[e.key];
      game[m[0]] += m[1];
      game.log.push([m[0], m[1]]);
      commit();
    }else if(e.key === "Backspace" || e.key === "z"){
      el.undo.click();
    }
  });

  // ---- boot ----
  function start(snap){
    if(snap && snap.game && typeof snap.game.a === "number"){
      game = snap.game;
      if(Array.isArray(snap.results)) results = snap.results;
    }else{
      load();
    }
    render();
  }

  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return {game:game, results:results}; });
    }
  }catch(e){}

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  }else{
    start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
})();
</script>
